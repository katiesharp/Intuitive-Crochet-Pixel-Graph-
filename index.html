<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Pixel Chart</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
  :root {
    --bg: #faf8f4;
    --panel: #ffffff;
    --ink: #1a1a1a;
    --ink-2: #555;
    --ink-3: #8a8580;
    --line: #e6e2da;
    --line-2: #d6d1c7;
    --accent: oklch(0.62 0.17 35);
    --accent-soft: oklch(0.95 0.04 60);
    --shadow: 0 1px 0 rgba(0,0,0,.04), 0 8px 24px -12px rgba(0,0,0,.08);
    --mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
    --sans: "Helvetica Neue", Helvetica, Arial, system-ui, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: var(--bg); color: var(--ink); font-family: var(--sans); height: 100%; }
  body { overflow: hidden; }
  #root { height: 100vh; display: flex; flex-direction: column; }

  .topbar {
    height: 52px;
    display: flex; align-items: center;
    padding: 0 18px;
    border-bottom: 1px solid var(--line);
    background: var(--panel);
    gap: 14px;
    flex-shrink: 0;
  }
  .brand { display: flex; align-items: center; gap: 10px; font-weight: 600; letter-spacing: -0.01em; }
  .brand-mark {
    width: 22px; height: 22px;
    display: grid; grid-template-columns: repeat(3, 1fr); grid-template-rows: repeat(3, 1fr);
    gap: 1px; padding: 1px; border: 1px solid var(--ink); border-radius: 3px;
  }
  .brand-mark span { background: var(--ink); }
  .brand-mark span:nth-child(2), .brand-mark span:nth-child(4), .brand-mark span:nth-child(6), .brand-mark span:nth-child(8) { background: transparent; }
  .brand-mark span:nth-child(1), .brand-mark span:nth-child(9) { background: var(--accent); }
  .brand small { font-weight: 400; color: var(--ink-3); margin-left: 4px; font-size: 12px; text-transform: uppercase; letter-spacing: 0.08em; }

  .top-tools { display: flex; align-items: center; gap: 8px; margin-left: auto; }

  .layout { flex: 1; display: grid; grid-template-columns: 280px 1fr 280px; min-height: 0; transition: grid-template-columns .2s; }
  .layout[data-left="closed"] { grid-template-columns: 0 1fr 280px; }
  .layout[data-right="closed"] { grid-template-columns: 280px 1fr 0; }
  .layout[data-left="closed"][data-right="closed"] { grid-template-columns: 0 1fr 0; }

  .panel {
    background: var(--panel);
    overflow-x: hidden;
    overflow-y: auto;
    padding: 42px 18px 18px 18px;
    display: flex; flex-direction: column; gap: 22px;
    position: relative;
  }
  .panel.left { border-right: 1px solid var(--line); }
  .panel.right { border-left: 1px solid var(--line); }

  .panel-collapse-btn {
    position: absolute; top: 12px; right: 12px;
    width: 22px; height: 22px;
    appearance: none; border: 1px solid var(--line);
    background: var(--panel); border-radius: 5px;
    display: inline-flex; align-items: center; justify-content: center;
    color: var(--ink-3); cursor: pointer; z-index: 2;
    transition: color .12s, border-color .12s;
  }
  .panel-collapse-btn:hover { color: var(--ink); border-color: var(--ink-3); }
  .panel-collapse-btn.right { right: auto; left: 12px; }

  .panel-show-btn {
    position: absolute; top: 12px;
    width: 22px; height: 36px;
    appearance: none; border: 1px solid var(--line-2);
    background: var(--panel);
    display: inline-flex; align-items: center; justify-content: center;
    color: var(--ink-2); cursor: pointer; z-index: 6;
    transition: color .12s, border-color .12s, background .12s;
  }
  .panel-show-btn:hover { color: var(--ink); border-color: var(--ink); }
  .panel-show-btn.left {
    left: 0; border-left: 0;
    border-top-right-radius: 8px; border-bottom-right-radius: 8px;
  }
  .panel-show-btn.right {
    right: 0; border-right: 0;
    border-top-left-radius: 8px; border-bottom-left-radius: 8px;
  }

  .stage {
    background:
      radial-gradient(circle at center, rgba(0,0,0,0) 0, rgba(0,0,0,0.015) 100%),
      linear-gradient(var(--line) 1px, transparent 1px) 0 0 / 24px 24px,
      linear-gradient(90deg, var(--line) 1px, transparent 1px) 0 0 / 24px 24px,
      var(--bg);
    overflow: hidden;
    position: relative;
    min-height: 0;
    user-select: none;
  }
  .stage.panning { cursor: grabbing; }
  .stage-inner {
    position: absolute;
    left: 0; top: 0;
    transform-origin: 0 0;
    will-change: transform;
  }
  .pixel-canvas {
    image-rendering: pixelated;
    display: block;
    box-shadow: var(--shadow);
    background: #fff;
  }

  .section-label {
    font-size: 11px; text-transform: uppercase; letter-spacing: 0.1em;
    color: var(--ink-3); font-weight: 600; margin-bottom: 10px;
  }
  .section { display: flex; flex-direction: column; }

  .control { display: flex; flex-direction: column; gap: 6px; }
  .control + .control { margin-top: 12px; }
  .control-row { display: flex; align-items: center; justify-content: space-between; }
  .control-label { font-size: 13px; color: var(--ink-2); }
  .control-value { font-family: var(--mono); font-size: 12px; color: var(--ink); font-variant-numeric: tabular-nums; }

  input[type="range"] {
    -webkit-appearance: none; appearance: none; width: 100%; height: 22px; background: transparent;
  }
  input[type="range"]::-webkit-slider-runnable-track {
    height: 2px; background: var(--line-2); border-radius: 2px;
  }
  input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none; appearance: none;
    width: 14px; height: 14px; border-radius: 50%;
    background: var(--ink); border: 2px solid var(--panel);
    box-shadow: 0 0 0 1px var(--ink);
    margin-top: -6px;
    cursor: pointer;
  }
  input[type="range"]::-moz-range-track { height: 2px; background: var(--line-2); border-radius: 2px; }
  input[type="range"]::-moz-range-thumb {
    width: 14px; height: 14px; border-radius: 50%;
    background: var(--ink); border: 2px solid var(--panel); box-shadow: 0 0 0 1px var(--ink); cursor: pointer;
  }

  .btn {
    appearance: none; border: 1px solid var(--line-2); background: var(--panel);
    color: var(--ink); font-family: var(--sans); font-size: 13px;
    padding: 7px 12px; border-radius: 6px; cursor: pointer;
    display: inline-flex; align-items: center; gap: 6px;
    transition: background .12s, border-color .12s, color .12s;
  }
  .btn:hover { border-color: var(--ink-3); }
  .btn.primary { background: var(--ink); color: #fff; border-color: var(--ink); }
  .btn.primary:hover { background: #000; }
  .btn.ghost { background: transparent; border-color: transparent; color: var(--ink-2); }
  .btn.ghost:hover { color: var(--ink); background: var(--bg); }
  .btn .kbd { font-family: var(--mono); font-size: 10px; color: var(--ink-3); padding: 1px 4px; border: 1px solid var(--line); border-radius: 3px; margin-left: 4px; }

  .tool-group {
    display: grid; grid-template-columns: 1fr 1fr; gap: 6px;
  }
  .tool {
    border: 1px solid var(--line-2); background: var(--panel); border-radius: 6px;
    padding: 10px 8px; cursor: pointer; text-align: left;
    display: flex; flex-direction: column; gap: 2px;
    transition: all .12s;
  }
  .tool:hover { border-color: var(--ink-3); }
  .tool.active { border-color: var(--ink); background: var(--ink); color: #fff; }
  .tool .tool-name { font-size: 12px; font-weight: 600; letter-spacing: -0.01em; display: flex; align-items: center; justify-content: space-between; gap: 6px; }
  .tool .tool-key {
    font-family: var(--mono); font-size: 10px;
    padding: 1px 5px; border: 1px solid var(--line); border-radius: 3px;
    color: var(--ink-3); font-weight: 500;
    flex-shrink: 0;
  }
  .tool.active .tool-key {
    border-color: rgba(255,255,255,.25);
    color: rgba(255,255,255,.7);
  }
  .tool .tool-desc { font-size: 10.5px; opacity: 0.7; line-height: 1.35; }

  .toggle-row {
    display: flex; align-items: center; justify-content: space-between;
    padding: 8px 0;
  }
  .toggle-row + .toggle-row { border-top: 1px solid var(--line); }
  .toggle-row .toggle-label { font-size: 13px; color: var(--ink); }
  .toggle-row .toggle-sub { font-size: 11px; color: var(--ink-3); }

  .switch {
    width: 32px; height: 18px; background: var(--line-2); border-radius: 999px;
    position: relative; cursor: pointer; transition: background .15s;
    flex-shrink: 0;
  }
  .switch::after {
    content: ""; position: absolute; left: 2px; top: 2px;
    width: 14px; height: 14px; background: #fff; border-radius: 50%;
    transition: transform .15s;
  }
  .switch.on { background: var(--ink); }
  .switch.on::after { transform: translateX(14px); }

  .seg {
    display: inline-flex; border: 1px solid var(--line-2); border-radius: 6px;
    overflow: hidden; flex-shrink: 0;
  }
  .seg button {
    appearance: none; border: 0; background: var(--panel); color: var(--ink-2);
    font-family: var(--sans); font-size: 11px; padding: 5px 8px;
    cursor: pointer; border-right: 1px solid var(--line);
    transition: background .12s, color .12s;
    font-variant-numeric: tabular-nums;
  }
  .seg button:last-child { border-right: 0; }
  .seg button:hover { background: var(--bg); color: var(--ink); }
  .seg button.active { background: var(--ink); color: #fff; }

  .palette-list { display: flex; flex-direction: column; gap: 4px; }
  .swatch-row {
    display: flex; align-items: center; gap: 10px;
    padding: 6px; border-radius: 6px; cursor: pointer;
    border: 1px solid transparent;
  }
  .swatch-row:hover { background: var(--bg); }
  .swatch-row.selected { border-color: var(--ink); background: var(--bg); }
  .swatch {
    width: 22px; height: 22px; border-radius: 4px; border: 1px solid rgba(0,0,0,.15);
    flex-shrink: 0;
  }
  .swatch-meta { display: flex; flex-direction: column; line-height: 1.2; min-width: 0; flex: 1; }
  .swatch-hex { font-family: var(--mono); font-size: 11px; color: var(--ink); }
  .swatch-count { font-family: var(--mono); font-size: 10px; color: var(--ink-3); font-variant-numeric: tabular-nums; }
  .swatch-count-mute { color: var(--ink-3); opacity: 0.6; }
  .swatch-row.done .swatch { opacity: 0.45; }
  .swatch-row.done .swatch-hex { text-decoration: line-through; color: var(--ink-3); }
  .swatch-row.done .swatch-count { color: var(--accent); }
  .swatch-actions { display: flex; gap: 4px; }
  .icon-btn {
    width: 22px; height: 22px; border-radius: 4px; border: 1px solid var(--line-2);
    background: var(--panel); display: inline-flex; align-items: center; justify-content: center;
    cursor: pointer; padding: 0; color: var(--ink-2);
  }
  .number-input {
    display: inline-flex; align-items: center;
    border: 1px solid var(--line-2); border-radius: 6px;
    background: var(--panel);
    overflow: hidden;
  }
  .number-input button {
    appearance: none; border: 0; background: transparent;
    width: 22px; height: 24px;
    font-family: var(--mono); font-size: 13px;
    color: var(--ink-2); cursor: pointer;
    display: inline-flex; align-items: center; justify-content: center;
    line-height: 1;
  }
  .number-input button:hover { background: var(--bg); color: var(--ink); }
  .number-input input {
    appearance: textfield; -moz-appearance: textfield;
    width: 44px; height: 24px;
    border: 0; border-left: 1px solid var(--line);
    border-right: 1px solid var(--line);
    background: transparent; text-align: center;
    font-family: var(--mono); font-size: 12px; color: var(--ink);
    font-variant-numeric: tabular-nums;
    padding: 0;
  }
  .number-input input::-webkit-outer-spin-button,
  .number-input input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
  .number-input input:focus { outline: 1px solid var(--ink); outline-offset: -1px; }

  .palette-add {
    margin-top: 6px;
    appearance: none;
    display: flex; align-items: center; gap: 6px;
    padding: 8px 10px;
    border: 1px dashed var(--line-2); border-radius: 6px;
    background: transparent; color: var(--ink-2);
    font-family: var(--sans); font-size: 12px; cursor: pointer;
    transition: border-color .12s, color .12s, background .12s;
  }
  .palette-add:hover { border-color: var(--ink); color: var(--ink); background: var(--bg); }

  .icon-btn[disabled] { opacity: 0.4; cursor: not-allowed; }
  .icon-btn[disabled]:hover { color: var(--ink-2); border-color: var(--line-2); }

  .upload-zone {
    border: 1px dashed var(--line-2); border-radius: 8px;
    padding: 18px; text-align: center; color: var(--ink-3);
    background: var(--bg); cursor: pointer; transition: border-color .15s, color .15s;
  }
  .upload-zone:hover, .upload-zone.drag { border-color: var(--ink); color: var(--ink); }
  .upload-zone strong { color: var(--ink); font-weight: 600; }
  .upload-zone .upload-sub { font-size: 11px; margin-top: 4px; color: var(--ink-3); }

  .cropper { display: flex; flex-direction: column; gap: 6px; margin-top: 10px; }
  .cropper-stage {
    position: relative; align-self: center;
    background: #0a0a0a;
    border-radius: 6px; overflow: hidden;
    box-shadow: inset 0 0 0 1px var(--line-2);
    user-select: none;
  }
  .cropper-dim {
    position: absolute; background: rgba(20,18,15,0.55);
    pointer-events: none;
  }
  .cropper-window {
    position: absolute; box-shadow: 0 0 0 1px #fff, 0 0 0 2px rgba(0,0,0,.5);
  }
  .cropper-window.active { box-shadow: 0 0 0 1px var(--accent), 0 0 0 2px rgba(0,0,0,.5); }
  .cropper-handle {
    position: absolute;
    width: 10px; height: 10px;
    background: #fff;
    border: 1px solid #1a1a1a;
    border-radius: 2px;
    transform: translate(-50%, -50%);
    z-index: 2;
  }
  .cropper-handle:hover { background: var(--accent); border-color: var(--accent); }
  .h-n, .h-s { width: 14px; }
  .h-e, .h-w { height: 14px; }
  .cropper-grid {
    position: absolute; inset: 0; pointer-events: none;
    background:
      linear-gradient(to right, transparent calc(33.33% - 0.5px), rgba(255,255,255,.4) calc(33.33% - 0.5px), rgba(255,255,255,.4) calc(33.33% + 0.5px), transparent calc(33.33% + 0.5px)),
      linear-gradient(to right, transparent calc(66.66% - 0.5px), rgba(255,255,255,.4) calc(66.66% - 0.5px), rgba(255,255,255,.4) calc(66.66% + 0.5px), transparent calc(66.66% + 0.5px)),
      linear-gradient(to bottom, transparent calc(33.33% - 0.5px), rgba(255,255,255,.4) calc(33.33% - 0.5px), rgba(255,255,255,.4) calc(33.33% + 0.5px), transparent calc(33.33% + 0.5px)),
      linear-gradient(to bottom, transparent calc(66.66% - 0.5px), rgba(255,255,255,.4) calc(66.66% - 0.5px), rgba(255,255,255,.4) calc(66.66% + 0.5px), transparent calc(66.66% + 0.5px));
  }
  .cropper-foot {
    display: flex; justify-content: space-between; align-items: center;
    font-size: 11px; color: var(--ink-3);
  }
  .cropper-hint { font-style: italic; }

  .floating-tools {
    position: absolute; top: 16px; left: 50%; transform: translateX(-50%);
    z-index: 6;
    display: flex; align-items: center; gap: 2px;
    padding: 4px;
    background: var(--panel);
    border: 1px solid var(--line-2);
    border-radius: 10px;
    box-shadow: var(--shadow);
  }
  .floating-tools .ftool {
    appearance: none; border: 0; background: transparent;
    font-family: var(--sans); font-size: 12px; color: var(--ink-2);
    padding: 6px 10px; border-radius: 6px; cursor: pointer;
    display: inline-flex; align-items: center; gap: 6px;
    transition: background .12s, color .12s;
  }
  .floating-tools .ftool:hover { background: var(--bg); color: var(--ink); }
  .floating-tools .ftool.active { background: var(--ink); color: #fff; }
  .floating-tools .ftool.active .ftool-key { background: rgba(255,255,255,.15); border-color: rgba(255,255,255,.25); color: #fff; }
  .floating-tools .ftool .ftool-key {
    font-family: var(--mono); font-size: 9.5px;
    padding: 1px 4px; border: 1px solid var(--line); border-radius: 3px;
    color: var(--ink-3); margin-left: 2px;
  }
  .floating-tools .ftool-dismiss {
    padding: 6px 8px;
    color: var(--ink-3);
  }
  .floating-tools .ftool-dismiss:hover { color: var(--ink); background: var(--bg); }
  .floating-tools .ftool-sep {
    width: 1px; height: 16px; background: var(--line); margin: 0 4px;
  }
  .floating-tools .ftool-key-hint {
    font-size: 10.5px; color: var(--ink-3);
    padding: 0 8px 0 4px;
    border-left: 1px solid var(--line); margin-left: 4px;
    display: inline-flex; align-items: center; gap: 4px;
  }
  .floating-tools .kbd-inline {
    font-family: var(--mono); font-size: 9.5px;
    padding: 1px 4px; border: 1px solid var(--line); border-radius: 3px;
    color: var(--ink-2);
  }
  .floating-tools-show {
    position: absolute; top: 16px; left: 50%; transform: translateX(-50%);
    z-index: 6;
    display: inline-flex; align-items: center; gap: 6px;
    padding: 8px 14px;
    background: var(--ink); color: #fff;
    border: 0; border-radius: 999px;
    font-family: var(--sans); font-size: 12px; font-weight: 500;
    cursor: pointer;
    box-shadow: var(--shadow);
    transition: background .12s;
  }
  .floating-tools-show:hover { background: #000; }

  .pixel-canvas {
    image-rendering: pixelated;
    display: block;
    box-shadow: var(--shadow);
    background: #fff;
  }

  .chart-wrapper {
    display: inline-flex; align-items: stretch;
    gap: 6px;
  }
  .row-arrows {
    display: flex; flex-direction: column;
    flex-shrink: 0;
  }
  .arrow-slot {
    display: inline-flex; align-items: center; justify-content: center;
    color: var(--ink-2);
  }
  .arrow-slot.iso { color: var(--accent); }
  .arrow-slot svg { display: block; }

  .stage-empty {
    position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center;
    color: var(--ink-3); font-size: 14px;
    pointer-events: none;
  }

  .zoom-controls {
    position: absolute; bottom: 16px; right: 16px;
    display: flex; gap: 2px; align-items: center;
    background: var(--panel);
    border: 1px solid var(--line-2);
    border-radius: 8px; padding: 4px;
    box-shadow: var(--shadow);
    z-index: 5;
  }
  .zoom-controls button {
    appearance: none; border: 0; background: transparent;
    width: 28px; height: 28px; border-radius: 5px;
    color: var(--ink-2); cursor: pointer;
    font-family: var(--sans); font-size: 14px; line-height: 1;
    display: inline-flex; align-items: center; justify-content: center;
    transition: background .12s, color .12s;
  }
  .zoom-controls button:hover { background: var(--bg); color: var(--ink); }
  .zoom-controls .zoom-readout {
    font-family: var(--mono); font-size: 11px;
    color: var(--ink); min-width: 56px;
    border-radius: 4px;
  }

  /* Color picker dialog */
  .picker-overlay {
    position: fixed; inset: 0; background: rgba(20,18,15,.35);
    display: flex; align-items: center; justify-content: center; z-index: 50;
    backdrop-filter: blur(2px);
  }
  .picker {
    background: var(--panel); border-radius: 12px; padding: 18px; min-width: 320px;
    box-shadow: 0 30px 60px -20px rgba(0,0,0,.3);
  }
  .picker h3 { margin: 0 0 4px 0; font-size: 15px; font-weight: 600; }
  .picker p { margin: 0 0 14px 0; font-size: 12px; color: var(--ink-3); }
  .picker .from-to { display: flex; align-items: center; gap: 12px; margin-bottom: 14px; }
  .picker .from-to .arrow { color: var(--ink-3); font-size: 18px; }
  .picker .preview {
    width: 56px; height: 56px; border-radius: 8px; border: 1px solid rgba(0,0,0,.1);
    display: flex; align-items: end; justify-content: center; padding: 4px;
  }
  .picker .preview span { font-family: var(--mono); font-size: 10px; color: rgba(0,0,0,.6); background: rgba(255,255,255,.8); padding: 1px 4px; border-radius: 3px; }
  .picker .grid-colors { display: grid; grid-template-columns: repeat(8, 1fr); gap: 4px; margin-bottom: 12px; }
  .picker .grid-colors button {
    width: 100%; aspect-ratio: 1; border-radius: 5px; border: 1px solid rgba(0,0,0,.1);
    cursor: pointer; padding: 0;
  }
  .picker .picker-actions { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  .picker .picker-actions input[type=color] {
    width: 36px; height: 32px; border: 1px solid var(--line-2); border-radius: 6px;
    background: var(--panel); padding: 2px; cursor: pointer;
  }
  .picker .picker-actions .right { display: flex; gap: 6px; }

  .text-input {
    flex: 1; min-width: 0;
    font-family: var(--sans); font-size: 13px;
    padding: 7px 10px;
    border: 1px solid var(--line-2); border-radius: 6px;
    background: var(--panel); color: var(--ink);
    outline: none;
    transition: border-color .12s;
  }
  .text-input:focus { border-color: var(--ink); }

  .project-list { display: flex; flex-direction: column; gap: 4px; max-height: 320px; overflow-y: auto; }
  .project-row {
    display: flex; align-items: center; gap: 10px;
    padding: 8px 10px;
    border: 1px solid var(--line); border-radius: 6px;
    background: var(--panel);
  }
  .project-row.current { border-color: var(--ink); background: var(--bg); }
  .project-swatches {
    display: inline-grid;
    grid-template-columns: repeat(4, 8px);
    grid-template-rows: repeat(2, 8px);
    gap: 2px;
    flex-shrink: 0;
  }
  .project-swatch {
    width: 8px; height: 8px; border-radius: 2px;
    border: 1px solid rgba(0,0,0,.1);
  }
  .project-meta { flex: 1; min-width: 0; overflow: hidden; }
  .project-name { font-size: 13px; font-weight: 600; color: var(--ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .project-current { color: var(--accent); font-weight: 500; font-size: 11px; text-transform: uppercase; letter-spacing: 0.05em; }
  .project-sub { font-size: 11px; color: var(--ink-3); font-family: var(--mono); }

  /* Status / hint bar */
  .hintbar {
    position: absolute; bottom: 16px; left: 16px;
    background: var(--ink); color: #fff; font-size: 12px;
    padding: 8px 14px; border-radius: 999px;
    display: flex; align-items: center; gap: 8px;
    box-shadow: var(--shadow);
    pointer-events: none;
    white-space: nowrap;
    max-width: calc(100% - 200px);
  }
  .hintbar .msg { white-space: nowrap; }
  .hintbar .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--accent); }
  .hintbar .kbd { font-family: var(--mono); font-size: 10px; opacity: 0.7; padding: 1px 5px; border: 1px solid rgba(255,255,255,.2); border-radius: 3px; }

  .badge {
    display: inline-flex; align-items: center; gap: 4px;
    font-family: var(--mono); font-size: 10.5px; color: var(--ink-3);
    padding: 2px 6px; border: 1px solid var(--line); border-radius: 4px;
  }
  .badge-dot {
    width: 6px; height: 6px; border-radius: 50%;
    background: var(--accent); margin-left: 2px;
  }

  .autosave-indicator {
    display: inline-flex; align-items: center; gap: 6px;
    font-size: 11px; color: var(--ink-3);
    padding: 0 6px;
    min-width: 80px;
    font-variant-numeric: tabular-nums;
  }
  .autosave-dot {
    width: 6px; height: 6px; border-radius: 50%;
    background: var(--line-2);
    transition: background .15s;
  }
  .autosave-dot.saving { background: oklch(0.75 0.15 75); animation: pulse 1s ease-in-out infinite; }
  .autosave-dot.saved { background: oklch(0.68 0.16 145); }
  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.4; }
  }

  .row-readout {
    position: absolute; top: 16px; left: 16px; right: 16px;
    z-index: 5;
    background: var(--panel);
    border: 1px solid var(--line-2);
    border-radius: 10px;
    padding: 10px 14px;
    box-shadow: var(--shadow);
    font-family: var(--mono); font-size: 11px; color: var(--ink-3);
    line-height: 1.6;
    display: flex; flex-direction: column; gap: 8px;
    max-width: calc(100% - 32px);
  }
  .row-readout-line { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
  .row-label {
    font-family: var(--sans); font-size: 12px; font-weight: 600;
    color: var(--ink); text-transform: uppercase; letter-spacing: 0.05em;
    display: inline-flex; align-items: center; gap: 6px;
  }
  .row-dir {
    display: inline-flex; align-items: center; justify-content: center;
    color: var(--accent);
    padding: 2px; border-radius: 4px;
    background: var(--accent-soft);
  }
  .row-pills { display: inline-flex; flex-wrap: wrap; gap: 4px; }
  .row-readout .pill {
    appearance: none;
    display: inline-flex; align-items: center; gap: 5px;
    padding: 3px 8px; border-radius: 4px;
    background: var(--panel); border: 1px solid var(--line);
    cursor: pointer;
    font-family: var(--mono); font-size: 11px; color: var(--ink);
    font-variant-numeric: tabular-nums;
    transition: border-color .12s, background .12s, color .12s;
  }
  .row-readout .pill:hover { border-color: var(--ink-3); }
  .row-readout .pill.partial { border-color: var(--accent); }
  .row-readout .pill.done {
    background: var(--bg); color: var(--ink-3);
    border-color: var(--line);
  }
  .row-readout .pill.done .dot { opacity: 0.4; }
  .row-readout .pill .check { color: var(--accent); font-weight: 700; font-size: 10px; }
  .row-readout .pill .pill-of { color: var(--ink-3); opacity: 0.6; font-size: 10px; }
  .row-readout .pill .dot { width: 8px; height: 8px; border-radius: 2px; border: 1px solid rgba(0,0,0,.15); }
  .row-actions { display: flex; gap: 6px; }

  .cropper-row-band {
    position: absolute; pointer-events: none;
    background: rgba(217, 119, 87, 0.18);
    box-shadow:
      inset 0 0 0 1px var(--accent),
      0 0 0 1px rgba(255, 255, 255, 0.4);
    z-index: 1;
  }

  /* scrollbars */
  .panel::-webkit-scrollbar, .stage::-webkit-scrollbar { width: 10px; height: 10px; }
  .panel::-webkit-scrollbar-thumb, .stage::-webkit-scrollbar-thumb { background: var(--line-2); border-radius: 999px; border: 2px solid var(--panel); }
  .stage::-webkit-scrollbar-thumb { border-color: var(--bg); }
</style>
</head>
